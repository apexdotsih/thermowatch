name: Ingest FIRMS into Supabase
on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes. GitHub may delay scheduled runs under load.
    - cron: '*/15 * * * *'
permissions:
  contents: read
concurrency:
  group: firms-ingestion
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock

      - name: Ingest worldwide observations from three VIIRS satellites
        id: ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          AREA: 'world'
        run: |
          set -o pipefail
          total=0
          ok=0
          for src in VIIRS_SNPP_NRT VIIRS_NOAA20_NRT VIIRS_NOAA21_NRT; do
            echo "::group::$src"
            if out=$(python -m ingestion.firms.run --source "$src" --area "$AREA" --days 1); then
              echo "$out"
              n=$(python -c "import json,sys; print(json.loads(sys.argv[1])['unique_records_submitted'])" "$out")
              total=$((total + n))
              ok=$((ok + 1))
            else
              echo "WARNING: $src ingestion failed"
            fi
            echo "::endgroup::"
          done
          echo "satellites_succeeded=$ok" >> "$GITHUB_OUTPUT"
          echo "records_submitted=$total" >> "$GITHUB_OUTPUT"
          echo "### FIRMS ingest" >> "$GITHUB_STEP_SUMMARY"
          echo "- satellites succeeded: $ok / 3" >> "$GITHUB_STEP_SUMMARY"
          echo "- records submitted: $total" >> "$GITHUB_STEP_SUMMARY"
          # Fail loudly instead of dying silently.
          if [ "$ok" -eq 0 ]; then
            echo "All three satellite ingests failed."
            exit 1
          fi