services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
  ingestion:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    profiles: [ingestion]
    command: ["python", "-m", "ingestion.firms.run", "--days", "2", "--area", "world"]
